name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-server.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Assert release target repository
        env:
          REPO: ${{ github.repository }}
        run: |
          # origin 是上游 fork（YanGHaYu/piko），正式发布仓库是 YanGHaYu/fnpak。
          # 推 tag 必须推到 fnpak remote（git push fnpak <tag>），否则这里直接 fail。
          test "${REPO}" = "YanGHaYu/fnpak" || {
            echo "ERROR: 发布仓库必须是 YanGHaYu/fnpak，当前为 ${REPO}" >&2
            echo "HINT: origin 是上游 fork；请用 git push fnpak main && git push fnpak <tag> 触发发布" >&2
            exit 1
          }

      - uses: actions/checkout@v4

      - name: Download fpk artifact
        uses: actions/download-artifact@v4
        with:
          name: fpk-package
          path: dist

      - name: Read version from manifest
        id: meta
        run: |
          APPNAME=$(sed -n 's/^appname[[:space:]]*=[[:space:]]*//p' fnos/manifest | tr -d '\r' | head -1)
          VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' fnos/manifest | tr -d '\r' | head -1)
          DISPLAY=$(sed -n 's/^display_name[[:space:]]*=[[:space:]]*//p' fnos/manifest | tr -d '\r' | head -1)
          test -n "$APPNAME"; test -n "$VERSION"; test -n "$DISPLAY"
          echo "appname=$APPNAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "display=$DISPLAY" >> "$GITHUB_OUTPUT"

      - name: Assert tag matches manifest version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "ERROR: tag ${GITHUB_REF_NAME} 与 manifest version ${VERSION} 不一致" >&2
            exit 1
          }

      - name: Write release notes
        env:
          APPNAME: ${{ steps.meta.outputs.appname }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cat > notes.md <<EOF
          > **非官方社区构建**：与 NihilDigit/Piko、PikPak、飞牛 fnOS 官方均无关联，未获其背书。

          - 版本：${GITHUB_REF_NAME}
          - 安装包：\`${APPNAME}.fpk\`（校验值见 \`sha256sum.txt\`）
          - 对应源码（AGPL-3.0-or-later）：${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}
          - 许可证：AGPL-3.0-or-later，完整文本见仓库 \`LICENSE\`；本构建的 Corresponding Source 即上述 tag。

          安装：在 fnOS 应用中心上传 fpk，首次打开设置访问口令，并为应用授权至少一个目录。
          EOF
          # 本版变更：从 CHANGELOG.md 抽取当前版本段落，避免 Release 正文缺变更说明
          grep -q "^## ${VERSION} " CHANGELOG.md || {
            echo "ERROR: CHANGELOG.md 缺少 ${VERSION} 段落" >&2
            exit 1
          }
          {
            echo ""
            echo "## 本版变更"
            echo ""
            awk -v hdr="## ${VERSION} " 'index($0, hdr) == 1 { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md
          } >> notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY: ${{ steps.meta.outputs.display }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.fpk dist/sha256sum.txt \
            --repo YanGHaYu/fnpak \
            --title "${DISPLAY} ${GITHUB_REF_NAME}" \
            --notes-file notes.md

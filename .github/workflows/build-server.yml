name: build-server

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build server distribution
        # 不再写机器级 ~/.gradle/gradle.properties：用 fpkOnly 只评估 :shared/:server（不需要 JDK 25），
        # 并关闭 toolchain 自动下载，缺 JDK 21 时直接失败而不是走 foojay 解析
        run: |
          chmod +x gradlew scripts/*.sh build-nodev.sh
          ./gradlew :server:installDist --configure-on-demand --no-daemon --stacktrace \
            -Pfnpak.fpkOnly=true \
            -Porg.gradle.java.installations.auto-download=false

      - name: Read app metadata from manifest
        id: meta
        run: |
          APPNAME=$(sed -n 's/^appname[[:space:]]*=[[:space:]]*//p' fnos/manifest | tr -d '\r' | head -1)
          VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' fnos/manifest | tr -d '\r' | head -1)
          test -n "$APPNAME"
          test -n "$VERSION"
          echo "appname=$APPNAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install fnpack (linux-amd64, sha256 verified)
        env:
          FNPACK_URL: https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64
          FNPACK_SHA256: 72d2a4095da676b64510b023731a227b369d80f8079bc45ff8a2f802ec0480c1
        run: |
          curl -fsSL "$FNPACK_URL" -o /tmp/fnpack
          echo "${FNPACK_SHA256}  /tmp/fnpack" | sha256sum -c -
          chmod +x /tmp/fnpack
          /tmp/fnpack --help >/dev/null

      - name: Build fpk
        env:
          FNPACK: /tmp/fnpack
          # installDist 已在上一步完成，避免重复跑 Gradle
          SKIP_INSTALL_DIST: '1'
        run: ./scripts/build-fpk.sh

      - name: Verify fpk (0755 + GLIBC <= 2.36)
        run: ./scripts/check-fpk.sh build/fpk/stage

      - name: Upload fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpk-package
          path: |
            dist/*.fpk
            dist/sha256sum.txt
          if-no-files-found: error
          retention-days: 14
